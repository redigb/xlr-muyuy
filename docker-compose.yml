# ⚠️ Solo el líder edita este archivo.
services:
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro        # calendarios, cultivos y reglas (JSON)

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
