# ⚠️ Solo el líder edita este archivo.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: muyuy
      POSTGRES_USER: muyuy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data      # sin puerto público
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muyuy -d muyuy"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/redigb/xlr-muyuy-backend:${IMAGE_TAG:-latest}   # la arma GitHub Actions
    build: ./backend                                               # solo en local: docker compose up --build
    env_file: .env
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./data:/app/data:ro        # calendarios, cultivos y reglas (JSON)

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
