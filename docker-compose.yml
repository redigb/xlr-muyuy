# ⚠️ Solo el líder edita este archivo.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: muyuy
      POSTGRES_USER: muyuy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data      # sin puerto público
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muyuy -d muyuy"]
      interval: 5s
      retries: 10

  pipeline-api:                          # SPECS_v2 §11.3: calendario NASA para cualquier punto
    build: ./pipeline                     # Python liviano: la VM lo construye en cada deploy
    image: muyuy-pipeline-api:local
    restart: unless-stopped
    volumes:
      - pipeline_raw:/app/raw             # descargas de NASA POWER reutilizables (sin puerto público)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 10s
      retries: 6

  backend:
    image: ${IMAGE:-ghcr.io/redigb/xlr-muyuy}:${IMAGE_TAG:-latest}   # la arma GitHub Actions (IMAGE = ghcr.io/<repo>)
    build: ./backend                                               # solo en local: docker compose up --build
    env_file: .env
    environment:
      MUYUY_PIPELINE_URL: http://pipeline-api:8000
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      pipeline-api: { condition: service_started }
    volumes:
      - ./data:/app/data:ro        # calendarios, cultivos y reglas (JSON)

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  pipeline_raw:
  caddy_data:
  caddy_config:
