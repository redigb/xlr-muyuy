<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muyuy — Andean terrain</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font: 14px system-ui, sans-serif; color: #e8f1dc; }
    #terrain { width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; }
    canvas:active { cursor: grabbing; }
    #demo { position: absolute; bottom: 12px; left: 12px; right: 12px; background: #12241a; border: 1px solid #547156; border-radius: 12px; padding: 12px 15px; }
    #demo[hidden] { display: none; }
    #demo input { width: 100%; accent-color: #d9ef96; }
    #reading { color: #d6e5be; margin: 6px 0 0; }
    button { font: inherit; cursor: pointer; color: #ecf4dc; border: 1px solid #547156; background: transparent; border-radius: 8px; padding: 7px 12px; }
    button[aria-pressed=true] { background: #d9ef96; color: #12241a; }
    button:focus-visible, input:focus-visible { outline: 2px solid #d9ef96; outline-offset: 3px; }
    #fallback { position: absolute; inset: 12px; text-align: center; align-content: center; pointer-events: none; }
    #fallback[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="terrain" role="img" aria-label="Three-dimensional model of an Andean hillside with terraced fields"></div>
  <div id="fallback" hidden>3D rendering is unavailable on this device.</div>
  <section id="demo" aria-label="Terrain demo controls" hidden>
    <label for="month"><span id="month-label">Month</span> <output id="month-name" for="month"></output></label>
    <input id="month" type="range" min="1" max="12" value="6">
    <div>
      <button type="button" data-layer="normal" aria-pressed="true">Terrain</button>
      <button type="button" data-layer="helada" aria-pressed="false">Frost</button>
      <button type="button" data-layer="agua" aria-pressed="false">Water balance</button>
    </div>
    <p id="reading" aria-live="polite"></p>
  </section>
  <script src="./three.module.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hero = params.has('hero');
    const standaloneDemo = params.get('demo') === '1' && !params.has('embed');
    const state = { month: 6, layer: 'normal', calendar: new Map(), zone: null };
    const words = {
      en: ['Month', 'Terrain', 'Frost', 'Water balance', 'Terrace view', 'No data for this month', 'Example calendar', '3D rendering is unavailable on this device.', '3D terrain of an Andean hillside'],
      es: ['Mes', 'Terreno', 'Heladas', 'Balance hídrico', 'Vista de terrazas', 'Sin datos para este mes', 'Calendario de ejemplo', 'La vista 3D no está disponible en este dispositivo.', 'Terreno 3D de una ladera andina'],
      qu: ['Killa', 'Allpa', 'Qasa', 'Yaku puchu', 'Andinkunata qaway', 'Kay killapa willakuynin manam kanchu', 'Mallinapaq killa', 'Kay dispositivopi 3D mana rikurinchu.', 'Anti urqu qatapa 3D rikuchiynin'],
      ay: ['Phaxsi', 'Uraqi', 'Juyphi', 'Uma jilata', 'Andenenaka uñjam', 'Aka phaxsina yatiyawix janiwa utjkiti', 'Yant’awi phaxsi', 'Aka dispositivon 3D janiwa uñstkiti.', 'Andes qullu iramana 3D uñacht’awipa'],
    };
    const months = {
      qu: 'Qulla-puquy Hatun-puquy Pawqar-waray Ayriwa Aymuray Inti-raymi Anta-situa Qhapaq-situa Quya-raymi Uma-raymi Aya-marka Qhapaq-raymi',
      ay: 'Chinuqa Anata Achuqa Qasäwi Llamayu Mara-t’aqa Willka-kuti Llumpaqa Sata Lapaka Awti Jallu-qallta',
    };
    const isLocale = (locale) => Object.hasOwn(words, locale);
    let locale = isLocale(params.get('lang')) ? params.get('lang') : 'en';
    const sample = {
      zona: { id: 'huanuco-sierra', elevacion_m: 3200 },
      calendario: [34, 39, 27, 2, -19, -38, -49, -40, -24, -8, 14, 28].map((water, index) => ({
        mes: index + 1,
        prob_helada: [.06, .04, .06, .13, .29, .56, .66, .50, .29, .17, .10, .07][index],
        balance_hidrico_mm: water,
        estres_calor: 0,
      })),
    };

    const demo = document.querySelector('#demo');
    const slider = document.querySelector('#month');
    const reading = document.querySelector('#reading');
    const monthName = document.querySelector('#month-name');
    const layerButtons = [...demo.querySelectorAll('button')];
    let redraw = () => {};
    let setScroll = () => {};
    let turn = () => {};

    let lastData = '';
    function update() {
      const entry = state.calendar.get(state.month);
      const month = months[locale]?.split(' ')[state.month - 1].replace('-', ' ') ??
        new Intl.DateTimeFormat(locale, { month: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(2026, state.month - 1, 1)));
      const [monthLabel, terrainLabel, frostLabel, waterLabel, normal, missing, example, fallback, terrainDescription] = words[locale];
      const frost = typeof entry?.prob_helada === 'number' ? Math.round(entry.prob_helada * 100) : null;
      const water = typeof entry?.balance_hidrico_mm === 'number' ? entry.balance_hidrico_mm : null;
      const message = {
        normal,
        helada: frost === null ? missing : frost + '% · ' + frostLabel,
        agua: water === null ? missing : (water > 0 ? '+' : '') + water + ' mm · ' + waterLabel,
      }[state.layer];
      const caption = params.get('demo') === '1' && state.layer !== 'normal' ? message + ' · ' + example : message;
      document.documentElement.lang = locale;
      document.querySelector('#month-label').textContent = monthLabel;
      document.querySelector('#terrain').setAttribute('aria-label', terrainDescription);
      document.querySelector('#fallback').textContent = fallback;
      layerButtons.forEach((button, index) => { button.textContent = [terrainLabel, frostLabel, waterLabel][index]; });
      slider.value = state.month;
      slider.setAttribute('aria-valuetext', month);
      monthName.textContent = month;
      reading.textContent = caption;
      layerButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.layer === state.layer)));
      redraw();
      const data = JSON.stringify([state.month, state.layer, frost, water]);
      if (window.parent !== window && data !== lastData && location.origin !== 'null') {
        lastData = data;
        parent.postMessage({ type: 'muyuy-status', month: state.month, layer: state.layer, frost, water }, location.origin);
      }
    }

    window.muyuy = {
      cargarZona(input) {
        if (!input || !Array.isArray(input.calendario)) return;
        state.zone = input.zona ?? null;
        state.calendar = new Map(input.calendario.filter((entry) =>
          entry && Number.isInteger(entry.mes) && entry.mes >= 1 && entry.mes <= 12
        ).map((entry) => [entry.mes, entry]));
        update();
      },
      setMes(month) {
        if (!Number.isInteger(month) || month < 1 || month > 12 || month === state.month) return;
        state.month = month;
        update();
      },
      setCapa(layer) {
        if (!['normal', 'helada', 'agua'].includes(layer) || layer === state.layer) return;
        state.layer = layer;
        update();
      },
    };

    window.addEventListener('message', ({ source, origin, data }) => {
      if (source !== window.parent || origin !== location.origin || data?.type !== 'muyuy-terrain') return;
      if (isLocale(data.locale) && data.locale !== locale) {
        locale = data.locale;
        update();
      }
      if (typeof data.scroll === 'number' && Number.isFinite(data.scroll)) setScroll(data.scroll);
      if (typeof data.turn === 'number' && Number.isFinite(data.turn)) turn(Math.sign(data.turn));
      if (data.month !== undefined) window.muyuy.setMes(data.month);
      if (data.layer !== undefined) window.muyuy.setCapa(data.layer);
    });
    demo.hidden = !standaloneDemo;
    slider.addEventListener('input', () => window.muyuy.setMes(slider.valueAsNumber));
    layerButtons.forEach((button) => button.addEventListener('click', () => window.muyuy.setCapa(button.dataset.layer)));
    if (params.get('demo') === '1' || hero) window.muyuy.cargarZona(sample);

    try {
      createTerrain();
      update();
    } catch (error) {
      document.querySelector('#fallback').hidden = false;
      console.warn('Muyuy terrain:', error);
      update();
    }

    function createTerrain() {
      const host = document.querySelector('#terrain');
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'low-power' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      host.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 80);
      camera.position.set(12, 9, 14);
      camera.lookAt(0, 1.15, 0);
      scene.add(new THREE.HemisphereLight(0xf2ffd3, 0x47503d, 2.25));
      const sun = new THREE.DirectionalLight(0xffefd0, 2.5);
      sun.position.set(-6, 10, 5);
      scene.add(sun);

      const island = new THREE.Group();
      scene.add(island);
      const terrainMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.94 });
      const colors = ['#b2c46c', '#708b4b', '#9baa54', '#567645', '#a29b60', '#739447', '#3a593b'];
      const rockColors = ['#77704d', '#53523b', '#3d4833'];
      const green = new THREE.Color('#7caf4c');
      const ice = new THREE.Color('#509ff4');
      const dry = new THREE.Color('#e38240');
      const cells = [];
      const positions = [];
      const baseColors = [];
      const color = new THREE.Color();
      const width = 10;
      const length = 8;
      const columns = 36;
      const rows = 32;

      function height(x, z) {
        const depth = (4 - z) / 8;
        const ridge = Math.max(0, depth - 0.64) * (4.4 + 3.7 * Math.cos(x * 0.52 + 0.5));
        const terrace = Math.floor(depth * 8 + Math.sin(x * 0.34) * 0.48) * 0.24;
        return terrace + ridge + Math.sin(x * 1.2 + z * 1.6) * (depth > 0.65 ? 0.24 : 0.045);
      }

      function point(column, row) {
        const x = width * (column / columns - 0.5);
        const z = length * (row / rows - 0.5);
        const inset = 0.42 * Math.pow(Math.abs(z) / 4, 5);
        const wave = Math.sin(z * 1.3) * 0.23;
        const adjustedX = x * (1 - inset * 0.36) + wave;
        return [adjustedX, height(adjustedX, z), z];
      }

      function triangle(a, b, c, tint, climate = false) {
        if (climate) cells.push({ offset: baseColors.length, tint: color.set(tint).clone(), height: (a[1] + b[1] + c[1]) / 3 });
        color.set(tint);
        positions.push(...a, ...b, ...c);
        for (let vertex = 0; vertex < 3; vertex++) baseColors.push(color.r, color.g, color.b);
      }

      function wall(a, b) {
        const at = (point, y) => [point[0], y, point[2]];
        const seams = [-0.17, -0.47, -0.88];
        seams.forEach((level, index) => {
          const upperA = index ? at(a, seams[index - 1]) : a;
          const upperB = index ? at(b, seams[index - 1]) : b;
          const lowerA = at(a, level);
          const lowerB = at(b, level);
          triangle(upperA, lowerA, upperB, rockColors[index]);
          triangle(upperB, lowerA, lowerB, rockColors[index]);
        });
      }

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const a = point(column, row);
          const b = point(column + 1, row);
          const c = point(column, row + 1);
          const d = point(column + 1, row + 1);
          const field = Math.floor((rows - row - 1) / 4);
          const section = Math.floor((column + (field % 2) * 4) / 9);
          const shade = (field * 3 + section * 2) % colors.length;
          const tint = color.set(colors[shade]).multiplyScalar(0.89 + ((row * 7 + column * 13) % 9) / 47).getHex();
          triangle(a, c, b, tint, true);
          triangle(b, c, d, tint, true);
          if (row === 0) wall(b, a);
          if (row === rows - 1) wall(c, d);
          if (column === 0) wall(a, c);
          if (column === columns - 1) wall(d, b);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(baseColors, 3));
      geometry.computeVertexNormals();
      const colorAttribute = geometry.getAttribute('color');
      const nextColors = new Float32Array(baseColors);
      terrainMaterial.side = THREE.DoubleSide;
      island.add(new THREE.Mesh(geometry, terrainMaterial));

      const marker = new THREE.Object3D();
      const crops = [];
      for (let row = 0; row < 24; row++) {
        const z = 3.35 - row * 0.233;
        for (let column = 0; column < 22; column++) {
          if ((column + 1 + Math.floor(row / 4) * 2) % 8 < 2 || row % 4 === 3) continue;
          const x = -4.06 + column * 0.386;
          crops.push([x, height(x, z), z, 0.75 + ((row * 13 + column * 7) % 9) / 18]);
        }
      }
      const cropMaterial = new THREE.MeshStandardMaterial({ flatShading: true });
      const cropMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), cropMaterial, crops.length);
      crops.forEach(([x, y, z, scale], index) => {
        marker.position.set(x, y + 0.115 * scale, z);
        marker.scale.set(0.12 * scale, 0.23 * scale, 0.105 * scale);
        marker.rotation.y = index * 2.4;
        marker.updateMatrix();
        cropMesh.setMatrixAt(index, marker.matrix);
        cropMesh.setColorAt(index, color.set(['#335b34', '#486e36', '#b4bd57'][index % 3]));
      });
      island.add(cropMesh);

      const treeGeometry = new THREE.IcosahedronGeometry(1, 0);
      const treeMaterial = new THREE.MeshStandardMaterial({ color: '#35573c', flatShading: true });
      const trunkGeometry = new THREE.CylinderGeometry(0.035, 0.055, 0.4, 5);
      const trunkMaterial = new THREE.MeshStandardMaterial({ color: '#514634' });
      [[-4.25, 3.1], [4.26, 2.35], [4.05, 2.7], [-4.37, 1.1], [-3.35, -2.25], [2.95, -2.65], [3.6, -3.02], [-1.9, -3.06]].forEach(([x, z], index) => {
        const y = height(x, z);
        const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
        trunk.position.set(x, y + 0.2, z);
        island.add(trunk);
        const canopy = new THREE.Mesh(treeGeometry, treeMaterial);
        canopy.position.set(x, y + 0.52, z);
        canopy.scale.set(0.26 + index % 3 * 0.05, 0.43, 0.28);
        island.add(canopy);
      });

      let progress = 0;
      let dragAngle = 0;
      let angle = -0.14;
      let lift = 0;
      let zoom = 1;
      let frame = 0;
      let tintFrames = 0;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      const canvas = renderer.domElement;
      const targetAngle = () => -0.14 + dragAngle + (reduced.matches ? 0 : progress * 3.8);
      const targetLift = () => reduced.matches ? 0 : Math.sin(progress * Math.PI) * 0.52;
      const targetZoom = () => reduced.matches ? 1 : 1 + Math.sin(progress * Math.PI) * .19;
      function requestRender() {
        if (!frame) frame = requestAnimationFrame(render);
      }
      function render() {
        frame = 0;
        const factor = reduced.matches ? 1 : 0.16;
        angle += (targetAngle() - angle) * factor;
        lift += (targetLift() - lift) * factor;
        zoom += (targetZoom() - zoom) * factor;
        island.rotation.y = angle;
        island.position.y = lift;
        island.scale.setScalar(zoom);
        if (tintFrames > 0) {
          tintFrames = reduced.matches ? 0 : tintFrames - 1;
          const blend = tintFrames ? .17 : 1;
          for (let channel = 0; channel < nextColors.length; channel++) {
            const previous = colorAttribute.array[channel];
            colorAttribute.array[channel] = previous + (nextColors[channel] - previous) * blend;
          }
          colorAttribute.needsUpdate = true;
        }
        renderer.render(scene, camera);
        if (tintFrames || Math.abs(targetAngle() - angle) + Math.abs(targetLift() - lift) + Math.abs(targetZoom() - zoom) > 0.001) requestRender();
      }
      function resize() {
        const ratio = host.clientWidth / Math.max(host.clientHeight, 1);
        const portrait = hero && (ratio < 1 || host.clientWidth <= 650);
        const halfHeight = Math.max(hero ? 4.75 : 4.65, (portrait ? 6.9 : hero ? 9 : 6.75) / Math.max(ratio, 0.12));
        const shiftX = hero && !portrait ? halfHeight * ratio * .32 : 0;
        const shiftY = portrait ? -halfHeight * .34 : 0;
        camera.left = -halfHeight * ratio - shiftX;
        camera.right = halfHeight * ratio - shiftX;
        camera.top = halfHeight - shiftY;
        camera.bottom = -halfHeight - shiftY;
        camera.updateProjectionMatrix();
        renderer.setSize(host.clientWidth, host.clientHeight, false);
        requestRender();
      }
      new ResizeObserver(resize).observe(host);
      reduced.addEventListener('change', requestRender);
      setScroll = (value) => { progress = Math.min(Math.max(value, 0), 1); requestRender(); };
      turn = (direction) => { dragAngle += direction * Math.PI / 5; requestRender(); };
      let pointer = null;
      canvas.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || !event.isPrimary) return;
        pointer = event.clientX;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (pointer === null || !event.isPrimary) return;
        dragAngle += (event.clientX - pointer) * 0.009;
        pointer = event.clientX;
        requestRender();
      });
      canvas.addEventListener('lostpointercapture', () => { pointer = null; });
      canvas.addEventListener('webglcontextlost', () => { document.querySelector('#fallback').hidden = false; });
      canvas.addEventListener('webglcontextrestored', () => {
        document.querySelector('#fallback').hidden = true;
        requestRender();
      });
      redraw = () => {
        const entry = state.calendar.get(state.month);
        const frost = entry?.prob_helada;
        const water = entry?.balance_hidrico_mm;
        for (const { offset, tint, height } of cells) {
          color.copy(tint);
          if (state.layer === 'helada' && Number.isFinite(frost)) {
            const intensity = THREE.MathUtils.clamp(frost * (0.9 + height * 0.09), 0, 0.98);
            color.lerp(ice, intensity);
          }
          if (state.layer === 'agua' && Number.isFinite(water)) {
            color.lerp(water < 0 ? dry : green, THREE.MathUtils.clamp(Math.abs(water) / 64, 0.24, 0.92));
          }
          for (let vertex = 0; vertex < 3; vertex++) {
            const start = offset + vertex * 3;
            nextColors[start] = color.r;
            nextColors[start + 1] = color.g;
            nextColors[start + 2] = color.b;
          }
        }
        tintFrames = 27;
        requestRender();
      };
      resize();
    }
  </script>
</body>
</html>
