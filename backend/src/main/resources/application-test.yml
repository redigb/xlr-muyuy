# Perfil TEST (mvnw test / mvnw verify). Usa los JSON reales de data/ para validarlos.
muyuy:
  data-dir: ../data
  limites:
    dispositivos-por-hora: 100000     # las pruebas registran muchos dispositivos desde la misma IP

quarkus:
  datasource:
    jdbc:
      url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/muyuy_test}
  flyway:
    clean-at-start: true                # base de pruebas limpia en cada corrida
    clean-disabled: false
  http:
    test-port: 0                          # puerto libre aleatorio: no choca con quarkus:dev
  log:
    category:
      "pe.muyuy":
        level: INFO

groq:
  enabled: false                        # las pruebas nunca llaman a Groq real
  clave: test-sin-clave                   # nunca llama a Groq real en pruebas
