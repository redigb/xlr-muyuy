# ⚠️ Solo el líder edita la configuración. Pide los cambios por PR / chat.
# Base común + perfil DEV (mvnw quarkus:dev).
# Perfiles: application-test.yml (mvnw test) · application-prod.yml (jar / Docker)

muyuy:
  data-dir: ../data                   # JSON de data/ (relativo a backend/)
  imagen:                             # foto satelital en extras (zonas oficiales)
    activa: ${MUYUY_IMAGEN_ACTIVA:true}
    url: https://wvs.earthdata.nasa.gov/api/v1/snapshot
    # Compuesto anual Landsat (NASA WELD), sin nubes. Las capas diarias MODIS/VIIRS salen
    # tapadas de nubes en Huánuco. Fecha FIJA: misma foto = mismo hash = no sube la versión.
    capa: Landsat_WELD_CorrectedReflectance_TrueColor_Global_Annual
    fecha: "2000-12-01"
    radio-grados: 0.3                 # ~66 km por lado, ~100 KB
    pixeles: 600
  limites:
    dispositivos-por-hora: 30         # registros por IP (anti-bots)
    observaciones-por-dia: 50         # por dispositivo
    coordenadas-por-hora: 20          # /api/paquete/coordenada por IP
  coordenada:                         # paquete bajo demanda (SPECS_v2 §11.1)
    pipeline-url: ${MUYUY_PIPELINE_URL:http://localhost:8000}   # pipeline-api (FastAPI, sin puerto público)
    elevacion-url: https://api.open-meteo.com/v1/elevation      # sin clave; fuente no NASA (declararla)
    timeout-segundos: 25
    cache-dias: 30

quarkus:
  datasource:                         # PostgreSQL (dev: Laragon local)
    db-kind: postgresql
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/muyuy}
    devservices:
      enabled: false                    # usamos la base local, no Docker
  flyway:
    migrate-at-start: true              # crea/actualiza tablas al arrancar (db/migration)
  jackson:
    property-naming-strategy: SNAKE_CASE   # contrato JSON: prob_helada, t_min...
  http:
    port: 8080
    enable-compression: true            # gzip: el paquete baja ~5 KB
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:/.*/}       # dev: todo permitido
  swagger-ui:
    always-include: true                  # /q/swagger-ui también en prod
  rest-client:
    groq:
      url: https://api.groq.com/openai
      connect-timeout: 5000
      read-timeout: 30000
  log:
    category:
      "pe.muyuy":
        level: DEBUG

mp:
  openapi:
    extensions:
      smallrye:
        property-naming-strategy: com.fasterxml.jackson.databind.PropertyNamingStrategies$SnakeCaseStrategy   # docs = JSON real
        info:
          title: Muyuy API
          version: 0.1.0
          description: >-
            Backend of Muyuy (NASA Space Apps 2026, "Field Shift"). Turns NASA climate data into sealed,
            offline-first regional packages with crop-rotation options for smallholder farmers in Huánuco, Peru,
            and collects field observations back when there is signal. Field names are Spanish (frozen contract);
            every field is documented in English.

groq:
  enabled: true                         # sin clave no se llama a Groq: se usa la plantilla
  clave: ${GROQ_API_KEY:}               # nombre distinto a la env var: así .env no pisa el perfil test
  model: ${GROQ_MODEL:openai/gpt-oss-120b}   # elegido con scripts/eval_groq.py (llama-3.3-70b fue retirado)
  reasoning-effort: ${GROQ_REASONING_EFFORT:low}   # medium agota tokens y rompe el JSON en ~25% de llamadas
