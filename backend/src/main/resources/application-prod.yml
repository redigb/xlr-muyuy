# Perfil PROD (java -jar / Docker en Oracle). Valores sensibles vienen de .env.
muyuy:
  data-dir: ${MUYUY_DATA_DIR:/app/data}   # volumen montado en docker-compose

quarkus:
  datasource:
    username: ${DB_USER:muyuy}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://db:5432/muyuy}   # servicio "db" de docker-compose
  http:
    proxy:
      proxy-address-forwarding: true      # IP real del cliente detrás de Caddy (límite por IP)
    cors:
      origins: ${CORS_ORIGINS:/.*/}       # fija los orígenes reales en .env
  log:
    level: INFO
    category:
      "pe.muyuy":
        level: INFO
