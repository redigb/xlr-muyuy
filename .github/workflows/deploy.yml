name: Deploy Oracle

# push a main -> pruebas -> GitHub arma la imagen y la sube a GHCR -> la VM solo la descarga.
on:
  push:
    branches: [main]
    paths:                       # monorepo: solo despliega si cambia el backend o su infra
      - "backend/**"
      - "pipeline/**"
      - "data/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar jar (las pruebas ya pasaron)
        working-directory: backend
        run: mvn -B -q package -DskipTests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Armar y subir imagen (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.ci
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: produccion
    env:
      HOST: ${{ secrets.ORACLE_HOST }}
      USER: ${{ secrets.ORACLE_USER }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy     # sin \r de Windows
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "ORACLE_SSH_KEY no es una llave privada válida"; exit 1; }
          H=$(printf '%s' "$HOST" | tr -d '[:space:]')                 # tolera espacios/saltos al pegar secretos
          U=$(printf '%s' "$USER" | tr -d '[:space:]')
          ssh-keyscan -H "$H" >> ~/.ssh/known_hosts
          echo "DEST=$U@$H" >> "$GITHUB_ENV"

      - name: Login de la VM en GHCR (token temporal del job, por stdin)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "$DEST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Desplegar en la VM (pull, sin compilar)
        run: ssh -i ~/.ssh/id_deploy "$DEST" "IMAGE=${{ env.IMAGE }} IMAGE_TAG=${{ github.sha }} bash /opt/muyuy/deploy.sh"

      - name: Verificar salud (HTTPS)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$API_DOMAIN/q/health/ready"; then echo; echo "✅ Arriba"; exit 0; fi
            echo "Esperando ($i/30)..."; sleep 10
          done
          echo "❌ No respondió https://$API_DOMAIN/q/health/ready"; exit 1
