name: Pipeline CI

# Calendario NASA POWER + pipeline-api (FastAPI). Las pruebas no salen a internet.
on:
  pull_request:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline-ci.yml"]
  push:
    branches: [main, "feat/**"]
    paths: ["pipeline/**", ".github/workflows/pipeline-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
