name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/**"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JSON de data/
        run: for f in data/*.json; do jq empty "$f" || { echo "JSON inválido: $f"; exit 1; }; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y probar
        working-directory: backend
        run: mvn -B verify
