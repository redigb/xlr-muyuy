name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/**"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: muyuy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/muyuy_test
      TEST_DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Validar JSON de data/
        run: |
          for f in data/*.json; do
            jq empty "$f" || { echo "JSON invalido -> $f"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y probar
        working-directory: backend
        run: mvn -B verify
