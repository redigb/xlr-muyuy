name: Landing CI

# Solo corre si cambia la landing (Astro). No toca la VM.
on:
  pull_request:
    branches: [main]
    paths: ["landing/**", ".github/workflows/landing-ci.yml"]
  push:
    branches: [main, "feat/**"]
    paths: ["landing/**", ".github/workflows/landing-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4          # versión tomada de "packageManager" en package.json
        with:
          package_json_file: landing/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Instalar (lockfile congelado) y auditar
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

      - name: Compilar
        run: pnpm build

      # Verifica canonical/OG/Twitter, og-image 1200x630, robots.txt, sitemap.xml,
      # contenido indexable sin JS y que no se publiquen placeholders.
      # Hoy los checks de release son avisos; cuando exista el APK firmado,
      # cambiar por `pnpm verify:strict` para que rompan el build.
      - name: Verificar el build
        run: pnpm verify

      # Renderiza la isla en el servidor (página temporal) y la borra.
      # `astro build` no ejecuta los componentes `client:only`, así que un
      # ReferenceError dentro de LandingUI compilaría bien y dejaría la
      # página en negro. Este paso lo atrapa.
      - name: Verificar el render de la isla
        run: pnpm verify:render
